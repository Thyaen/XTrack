ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.1
    two_d_mode: true  # Enable 2D mode
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    map_frame: map
    odom_frame: odom_lidar_rl
    base_link_frame: base_link_rl
    base_link_output_frame: base_link_rl
    world_frame: odom_lidar_rl
    publish_tf: true

    # LiDAR odometry input (2D: x, y, yaw)
    odom0: /odom_modified
    odom0_config: [true, true, false,  # x, y, z
                   false, false, true,  # roll, pitch, yaw
                   true, true, false,   # vx, vy, vz
                   false, false, false, # vroll, vpitch, vyaw
                   false, false, false] # ax, ay, az
    odom0_differential: false
    odom0_queue_size: 10

    # IMU input (focus on yaw for 2D)
    imu0: /imu_rl
    imu0_config: [false, false, false,  # x, y, z
                  false, false, true,   # roll, pitch, yaw (only yaw enabled)
                  false, false, false,  # vx, vy, vz
                  false, false, true,   # vroll, vpitch, vyaw
                  false, false, false]  # ax, ay, az
    imu0_differential: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
